<!--  see https://jhildenbiddle.github.io/docsify-themeable/#/-->
<!--  <link rel="stylesheet" href="https://unpkg.com/docsify-themeable@0/dist/css/theme-simple.css">-->

  <style>
    .markdown-section code {
      font-weight: 400;
    }
    :root {
      --docsifytabs-border-color: #ededed;
      --docsifytabs-tab-highlight-color: purple;
    }

    .center
    {
      width: auto;
      align-content: center;
      display: table;
      margin-left: auto;
      margin-right: auto;
    }

    /* ---------- home page: README.md (.kb-home) ---------- */
    .kb-home h1 {
      font-size: 2.1rem;
      letter-spacing: -0.5px;
      margin-bottom: 0.4rem;
    }
    .kb-home .kb-lead {
      margin: 0 0 14px;
      font-size: 1.02rem;
      line-height: 1.75;
      opacity: 0.85;
    }
    .kb-home .kb-stats {
      display: inline-block;
      margin: 2px 0 22px;
      padding: 5px 14px;
      border-radius: 999px;
      background: rgba(128, 128, 128, 0.12);
      font-size: 0.85rem;
      opacity: 0.85;
    }
    .kb-home .kb-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
      margin: 16px 0 10px;
    }
    .kb-home .kb-grid-sm {
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 12px;
    }
    .kb-home .kb-card {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(128, 128, 128, 0.25);
      border-radius: 12px;
      padding: 14px 16px 16px;
      background: rgba(128, 128, 128, 0.045);
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }
    .kb-home .kb-card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 3px;
      background: linear-gradient(90deg, var(--theme-color, #42b983), rgba(66, 185, 131, 0.12));
      opacity: 0.8;
    }
    .kb-home .kb-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.10);
      border-color: var(--theme-color, #42b983);
    }
    .kb-home .kb-card h3 {
      margin: 0 0 6px !important;
      padding: 0;
      border: none !important;
      font-size: 1.02rem;
      font-weight: 600;
    }
    .kb-home .kb-card h3 a { color: inherit; text-decoration: none; }
    .kb-home .kb-card h3 a:hover { color: var(--theme-color, #42b983); text-decoration: none; }
    .kb-home .kb-card p {
      margin: 0 0 10px;
      font-size: .88rem;
      line-height: 1.85;
      opacity: 0.8;
    }
    .kb-home .kb-grid > .kb-card p code { font-size: .8rem; }
    .kb-home .kb-card code {
      display: inline-block;
      padding: 1px 8px;
      border-radius: 999px;
      background: rgba(128, 128, 128, 0.18);
      font-size: .78rem;
      font-weight: 400;
      opacity: 0.9;
    }
    .kb-home .kb-route {
      padding: 12px 18px;
      border-left: 3px solid var(--theme-color, #42b983);
      border-radius: 0 10px 10px 0;
      background: rgba(128, 128, 128, 0.05);
      line-height: 2;
    }
    .kb-home details {
      margin: 8px 0 20px;
      padding: 10px 16px;
      border: 1px dashed rgba(128, 128, 128, 0.3);
      border-radius: 10px;
    }
    .kb-home details summary { cursor: pointer; font-weight: 600; }
    .kb-home table { display: table; width: 100%; }
  </style>


</head>
<body>
<div id="app"></div>
<script>
  // var num = 0;
 // mermaid.initialize({ startOnLoad: true });

  window.$docsify = {
    disqus: 'shortname',
    name: 'Note',
    repo: 'https://github.com/Robinpig/Note',
    
    hideCode: {
      scroll: false,
      height: 300
    
    },

    markdown: {
      renderer: {
        code: function(code, lang) {

          if (lang === "sequence") {
            lang ="sequence-diagram"
          }

          if (lang==="dot") {
            return (
                    '<div class="viz">'+ Viz(code, "SVG")+'</div>'
            );
          }
          if (lang === "tex") {
            return (
                    '<span class="tex">'+ katex.renderToString(code, {
                      throwOnError: false
                    })+'</span>'
            );
          }
          //
          // if (lang === "mermaid") {
          //   return (
          //           '<div class="mermaid">' + mermaid.render('mermaid-svg-' + num++, code) + "</div>"
          //   );
          // }

          return this.origin.code.apply(this, arguments);
        }
      }
    },

    // see https://github.com/imyelo/docsify-plantuml
    plantuml: {
      skin: 'default',
    },
    loadSidebar: false,
    alias: {
      '/.*/_sidebar.md': '/_sidebar.md'
    },
    maxLevel: 4,
    externalLinkTarget: '_blank',
    sidebarDisplayLevel: 4,
    loadNavbar: false,
    mergeNavbar: true,
    auto2top: true,
    autoHeader: false,
    search: {
      placeholder: 'search',
      noData: 'nothing',
      depth: 1,
    },
    pagination: {
      previousText: 'Prev',
      nextText: 'Next',
      crossChapter: true,
      crossChapterText: true
    },
    count: {
      countable: true,
      fontsize: '0.9em',
      color: 'rgb(90,90,90)',
      language: 'english'
    },

    // see https://github.com/fzankl/docsify-plugin-flexible-alerts
    'flexible-alerts': {
      style: 'flat'
    },
    copyCode: {
      buttonText : 'Copy to clipboard',
      errorText  : 'Error',
      successText: 'Copied'
    },
    tabs: {
      persist    : true,      // default
      sync       : true,      // default
      theme      : 'classic', // default
      tabComments: true,      // default
      tabHeadings: true       // default
    },
    // docsify-toc 已移除：整站不再生成页内 Table of Contents（导航以首页目录 + 每篇笔记的 Links 区为准）
    share: {
      reddit: true,
      linkedin: true,
      facebook: true,
      twitter: true,
      whatsapp: true,
      telegram: true,
    },
    progress: {
      position: "top",
      color: "var(--theme-color,#42b983)",
      height: "3px",
    },
    footer: {
      copy: '',
      auth: 'Robin',
      pre: '<hr>',
      style:'text-align: center;'
    },
    remoteMarkdown: {
      tag: 'md',
    }
  }
</script>
